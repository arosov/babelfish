[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "babelfish"
version = "0.1.0"
description = "High-performance local STT pipeline using unified ONNX"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "numpy<2",
    "openwakeword",
    "pydantic>=2.12.5",
    "websockets>=14.2",
    "onnx-asr>=0.12.0",
    "huggingface-hub",
    "sounddevice",
    "soxr",
    "pynput",
    "notify-py",
    "pyperclip",
    "grapheme",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
# Pinned to the newest version each flavor line actually ships (the lines
# diverged permanently; ORT core is at ~monthly 1.25-1.30 cadence, DML stuck
# at 1.24, OVEP capped at 1.24.1). Bumps are independent per-flavor
# decisions with benchmark discipline.
cpu = [
    "onnxruntime==1.30.0",
]
# Unified Windows acceleration (AMD/Intel/NVIDIA)
windows-gpu = [
    "onnxruntime-directml==1.24.4", # flavor's latest; NO 1.25+ releases exist
]
# Native performance for NVIDIA on Linux.
# ORT >=1.27 is built for CUDA 13 only (cu12 support removed), and the cu13
# NVIDIA wheels moved to unprefixed consolidated names — nvidia-cudnn-cu13
# is the one exception (unprefixed `nvidia-cudnn` is a fake warning stub).
# No cuBLAS package: cuBLAS is not a declared dependency of ORT 1.30.
nvidia-linux = [
    "onnxruntime-gpu==1.30.0",
    "nvidia-cuda-runtime~=13.0",
    "nvidia-cuda-nvrtc~=13.0",
    "nvidia-cufft~=12.0",
    "nvidia-curand~=10.0",
    "nvidia-cudnn-cu13~=9.0",
    # nvidia-cudnn-cu13 depends on nvidia-cublas unpinned; pinned to the
    # newest release that ships a Windows wheel (13.8.1.x is Linux-only).
    "nvidia-cublas==13.8.0.4",
]
# Native performance for NVIDIA on Windows (same cu13 set as nvidia-linux)
nvidia-win = [
    "onnxruntime-gpu==1.30.0",
    "nvidia-cuda-runtime~=13.0",
    "nvidia-cuda-nvrtc~=13.0",
    "nvidia-cufft~=12.0",
    "nvidia-curand~=10.0",
    "nvidia-cudnn-cu13~=9.0",
    "nvidia-cublas==13.8.0.4",
]
# Native performance for Intel on Linux (capped: no 1.24.2+ OVEP wheels exist).
# Manual opt-in only: never auto-selected by the bootstrap (ADR 0007) —
# install the extra yourself and set hardware.device to an openvino id.
intel-linux = [
    "onnxruntime-openvino==1.24.1",
]

[tool.uv.sources]
openwakeword = { url = "https://github.com/dscripka/openWakeWord/archive/368c03716d1e92591906a84949bc477f3a834455.zip" }

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "nvidia-win" }, { extra = "nvidia-linux" }, { extra = "windows-gpu" }, { extra = "intel-linux" }],
]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin'",
]

[project.scripts]
babelfish = "babelfish_stt.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0.0",
    "jiwer>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
